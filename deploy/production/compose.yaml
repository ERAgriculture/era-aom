name: era-aom-production
services:
  fuseki:
    build:
      context: https://github.com/NatLibFi/Skosmos.git#v3.3:dockerfiles/jena-fuseki2-docker
      dockerfile: Dockerfile
      args: {JENA_VERSION: 5.4.0}
    command: --config=/fuseki/config.ttl
    environment: {JAVA_OPTIONS: "-Xmx2g -Xms1g"}
    expose: ["3030"]
    volumes: ["../local/fuseki.ttl:/fuseki/config.ttl:ro", "fuseki-data:/fuseki/databases"]
    restart: unless-stopped
  fuseki-cache:
    image: varnish:7.7.3
    depends_on: [fuseki]
    expose: ["80"]
    volumes: ["../local/varnish-default.vcl:/etc/varnish/default.vcl:ro"]
    restart: unless-stopped
  load-release:
    image: curlimages/curl:8.12.1
    depends_on: [fuseki]
    volumes: ["../../dist/releases/2026.1-rc.1:/release:ro"]
    command:
      - /bin/sh
      - -ec
      - |
        endpoint='http://fuseki:3030/skosmos/data?graph=https%3A%2F%2Fw3id.org%2Fera-aom%2Fgraph%2Flivestock'
        for file in aom-livestock.ttl aom-schema.ttl aom-semantic-bindings.ttl; do
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused -X POST \
            -H 'Content-Type: text/turtle' -T "/release/$${file}" "$${endpoint}"
        done
    restart: "no"
  skosmos:
    build:
      context: https://github.com/NatLibFi/Skosmos.git#v3.3
      dockerfile: dockerfiles/Dockerfile.ubuntu
    depends_on:
      load-release: {condition: service_completed_successfully}
      fuseki-cache: {condition: service_started}
    command:
      - /bin/sh
      - -ec
      - |
        sed -i 's/#maincontent/#main-content/' /var/www/html/src/view/base-template.twig
        sed -i '/id="navi3"/s|href="[^"]*"|href="https://github.com/ERAgriculture/era-aom/issues/new/choose"|' /var/www/html/src/view/base-template.twig
        sed -i 's/{{ "Feedback" | trans }}/Contribute/' /var/www/html/src/view/base-template.twig
        exec /usr/sbin/apache2ctl -D FOREGROUND
    expose: ["80"]
    volumes:
      - "../../config/skosmos/era-aom-production.ttl:/var/www/html/config.ttl:ro"
      - "../../config/skosmos/era-aom.css:/var/www/html/resource/css/era-aom.css:ro"
    restart: unless-stopped
  proxy:
    image: caddy:2.11.4-alpine
    depends_on: [skosmos]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  fuseki-data:
  caddy-data:
  caddy-config:
