name: sync proposal outcomes

on:
  push:
    branches: [main]
    paths:
      - data/governance/proposal_outcomes.csv

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate outcome register
        run: python scripts/validate_proposal_outcomes.py data/governance/proposal_outcomes.csv
      - name: Export changed outcomes
        run: >-
          python scripts/export_proposal_outcome_changes.py
          --changed-from "${{ github.event.before }}"
          --output /tmp/proposal-outcomes.json
      - name: Synchronize issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const outcomes = JSON.parse(fs.readFileSync('/tmp/proposal-outcomes.json', 'utf8'))
            const config = JSON.parse(fs.readFileSync('config/proposal-review-system.json', 'utf8'))
            for (const outcome of outcomes) {
              const issueNumber = Number(outcome.issue_number)
              const issueResponse = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              })
              const existingLabels = issueResponse.data.labels.map(label => label.name)
              for (const label of config.status_labels) {
                if (label !== outcome.workflow_status && existingLabels.includes(label)) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label
                  })
                }
              }
              const labelsToAdd = ['proposal', outcome.workflow_status].filter(label => !existingLabels.includes(label))
              if (labelsToAdd.length) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: labelsToAdd
                })
              }
              const marker = `<!-- aom-proposal-outcome:${outcome.outcome_id} -->`
              const registerUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/data/governance/proposal_outcomes.csv#L${outcome.register_line}`
              const details = [
                marker,
                '### Governed proposal outcome',
                `- Decision: **${outcome.decision}**`,
                `- Workflow status: **${outcome.workflow_status}**`,
                `- Reviewer: ${outcome.reviewer} (${outcome.decision_date})`,
                `- Register: ${registerUrl}`,
                `- Rationale: ${outcome.rationale}`
              ]
              if (outcome.implementation_pr) details.push(`- Implementation: ${outcome.implementation_pr}`)
              if (outcome.release_tag) details.push(`- Release: ${outcome.release_tag}`)
              const body = details.join('\n')
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              })
              const existingComment = comments.find(comment => comment.body.includes(marker))
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body
                })
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body
                })
              }
              const shouldClose = ['rejected', 'released'].includes(outcome.workflow_status)
              if (shouldClose && issueResponse.data.state !== 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                })
              }
              if (!shouldClose && issueResponse.data.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'open'
                })
              }
            }
      - name: Synchronize project review stages
        if: vars.PROPOSAL_PROJECT_URL != ''
        uses: actions/github-script@v7
        env:
          PROJECT_URL: ${{ vars.PROPOSAL_PROJECT_URL }}
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const fs = require('fs')
            const syncProjectStage = require('./scripts/sync_proposal_project_stage.js')
            const outcomes = JSON.parse(fs.readFileSync('/tmp/proposal-outcomes.json', 'utf8'))
            const config = JSON.parse(fs.readFileSync('config/proposal-review-system.json', 'utf8'))
            for (const outcome of outcomes) {
              const issueResponse = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(outcome.issue_number)
              })
              await syncProjectStage({
                github,
                projectUrl: process.env.PROJECT_URL,
                issueNodeId: issueResponse.data.node_id,
                statusLabel: outcome.workflow_status,
                config
              })
            }
