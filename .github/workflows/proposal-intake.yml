name: proposal intake

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  normalize-status:
    if: >-
      github.event.action == 'labeled' &&
      contains(github.event.issue.labels.*.name, 'proposal') &&
      contains(fromJSON('["needs-triage","in-review","accepted","rejected","implemented","released"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const config = JSON.parse(fs.readFileSync('config/proposal-review-system.json', 'utf8'))
            const selected = context.payload.label.name
            const current = context.payload.issue.labels.map(label => label.name)
            for (const label of config.status_labels) {
              if (label !== selected && current.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  name: label
                })
              }
            }

  route:
    if: >-
      contains(github.event.issue.labels.*.name, 'proposal') &&
      (github.event.action != 'labeled' || github.event.label.name == 'proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const config = JSON.parse(fs.readFileSync('config/proposal-review-system.json', 'utf8'))
            const issue = context.payload.issue
            const issueBody = issue.body || ''
            const marker = '<!-- aom-proposal-intake -->'
            const section = (heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const match = issueBody.match(new RegExp(`### ${escaped}\\s*\\n+([^\\n]+)`, 'i'))
              return match ? match[1].trim() : ''
            }
            const routeKey = section('Proposed module') || section('Affected domain') || 'uncertain'
            const route = config.domains[routeKey] || config.domains.uncertain
            const existingLabels = issue.labels.map(label => label.name)
            for (const label of config.status_labels) {
              if (label !== 'needs-triage' && existingLabels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label
                })
              }
            }
            const desiredLabels = ['proposal', 'needs-triage', ...route.labels]
            const missingLabels = desiredLabels.filter(label => !existingLabels.includes(label))
            if (missingLabels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: missingLabels
              })
            }
            const reviewers = route.reviewers.length ? route.reviewers : route.interim_reviewers
            if (reviewers.length) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: reviewers
              })
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            })
            if (!comments.some(comment => comment.body.includes(marker))) {
              const routeText = route.labels.length ? route.labels.join(', ') : 'domain unresolved'
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\nProposal received. Route: **${routeText}**. Next gate: completeness and duplicate checks. Final decisions require human review and a governed outcome-register row.`
              })
            }

  add-to-project:
    if: >-
      contains(github.event.issue.labels.*.name, 'proposal') &&
      vars.PROPOSAL_PROJECT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: add
        if: github.event.action != 'labeled' || github.event.label.name == 'proposal'
        uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e
        with:
          project-url: ${{ vars.PROPOSAL_PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
      - name: Synchronize project review stage
        uses: actions/github-script@v7
        env:
          PROJECT_ITEM_ID: ${{ steps.add.outputs.itemId }}
          PROJECT_URL: ${{ vars.PROPOSAL_PROJECT_URL }}
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const fs = require('fs')
            const syncProjectStage = require('./scripts/sync_proposal_project_stage.js')
            const config = JSON.parse(fs.readFileSync('config/proposal-review-system.json', 'utf8'))
            const selectedLabel = context.payload.action === 'labeled'
              ? context.payload.label.name
              : ''
            const intakeEvent = ['opened', 'reopened'].includes(context.payload.action) ||
              selectedLabel === 'proposal'
            const selectedStatus = config.status_labels.includes(selectedLabel)
              ? selectedLabel
              : intakeEvent
                ? 'needs-triage'
                : context.payload.issue.labels
                    .map(label => label.name)
                    .find(label => config.status_labels.includes(label))
            await syncProjectStage({
              github,
              projectUrl: process.env.PROJECT_URL,
              itemId: process.env.PROJECT_ITEM_ID,
              issueNodeId: context.payload.issue.node_id,
              statusLabel: selectedStatus,
              config
            })
