name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Validate normalized tables
        run: Rscript tests/validate_pilot.R data/pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semantic validators
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate livestock inventory
        run: python tests/validate_livestock_inventory.py
      - name: Validate livestock staging
        run: python tests/validate_livestock_staging.py
      - name: Validate livestock review pack
        run: python tests/validate_livestock_review_pack.py
      - name: Validate priority recommendations
        run: python tests/validate_priority_recommendations.py
      - name: Validate semantic model and dispositions
        run: |
          python scripts/build_semantic_bindings.py
          python tests/validate_semantic_model.py
      - name: Validate pinned NCBI taxon bindings
        run: python scripts/validate_ncbi_taxon_bindings.py
      - name: Parse semantic distributions
        run: |
          python -c 'from rdflib import Graph; [Graph().parse(path) for path in ["dist/pilot/prac.jsonld", "dist/pilot/prac.ttl", "dist/pilot/out.jsonld", "dist/pilot/out.ttl", "dist/livestock-staging/aom-livestock.jsonld", "dist/livestock-staging/aom-livestock.ttl", "dist/livestock-staging/aom-schema.ttl", "dist/livestock-staging/aom-semantic-bindings.jsonld", "dist/livestock-staging/aom-semantic-bindings.ttl"]]'
      - name: Validate SHACL
        run: |
          pyshacl --shacl schemas/shacl/concepts.ttl dist/pilot/prac.ttl
          pyshacl --shacl schemas/shacl/concepts.ttl dist/pilot/out.ttl
          pyshacl --shacl schemas/shacl/concepts.ttl dist/livestock-staging/aom-livestock.ttl
      - name: Rebuild and validate release candidate
        run: |
          python scripts/build_release_candidate.py --config=config/releases/2026.1-rc.1.json
          python scripts/validate_release_candidate.py --release=2026.1-rc.1
          python scripts/validate_bulk_proposals.py templates/bulk-change-proposals.csv --allow-empty
          python scripts/validate_deployment_bundle.py
