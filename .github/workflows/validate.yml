name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Validate normalized tables
        run: Rscript tests/validate_pilot.R data/pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semantic validators
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate livestock inventory
        run: python tests/validate_livestock_inventory.py
      - name: Validate livestock staging
        run: python tests/validate_livestock_staging.py
      - name: Validate livestock review pack
        run: python tests/validate_livestock_review_pack.py
      - name: Validate priority recommendations
        run: python tests/validate_priority_recommendations.py
      - name: Validate feed-material harmonization reviews
        run: |
          python scripts/build_feed_identity_audit.py
          python scripts/build_ontology_collision_governance.py
          python scripts/build_feedipedia_source_scope_review.py
          python scripts/build_public_authority_source_review.py
          python scripts/build_workbook_source_scope_review.py
          python scripts/build_ingredient_facet_value_governance.py
          python scripts/build_identity_alias_review.py
          python scripts/build_shared_page_review.py
          python scripts/build_workbook_model_gap_review.py
          python scripts/build_authority_model_consolidation.py
          python scripts/build_definition_hard_tail_review.py
          python scripts/build_final_definition_tail_register.py
          python scripts/build_authority_mapping_review.py
          python scripts/build_definition_enrichment.py
          python scripts/build_feed_identity_audit.py
          python scripts/build_ingredient_harmonization_workbench.py
          python scripts/build_ingredient_rule_quality_gate.py
          python scripts/promote_approved_ingredient_rules.py
          python scripts/build_ingredient_model_gap_review.py
          python tests/validate_feed_identity_audit.py
          python tests/validate_ontology_collision_governance.py
          python tests/validate_definition_enrichment.py
          python tests/validate_definition_gap_classification.py
          python tests/validate_feedipedia_definition_evidence.py
          python tests/validate_feedipedia_semantic_promotions.py
          python tests/validate_feedipedia_source_scope_review.py
          python tests/validate_public_authority_source_review.py
          python tests/validate_workbook_source_scope_review.py
          python tests/validate_definition_hard_tail_review.py
          python tests/validate_identity_alias_review.py
          python tests/validate_shared_page_review.py
          python tests/validate_workbook_model_gap_review.py
          python tests/validate_authority_model_consolidation.py
          python tests/validate_final_definition_tail_register.py
          python tests/validate_authority_mapping_review.py
          python tests/validate_ingredient_harmonization_workbench.py
          python tests/validate_ingredient_rule_quality_gate.py
          python tests/validate_approved_ingredient_rule_promotion.py
          python tests/validate_ingredient_model_gap_review.py
          python tests/validate_ingredient_semantic_closure.py
          python tests/validate_whole_grain_integrity.py
          python tests/validate_feed_material_source_overrides.py
          python tests/validate_maize_identity_review.py
          python tests/validate_maize_identity_implementation.py
          python tests/validate_feed_material_harmonization.py
      - name: Validate semantic model and dispositions
        run: |
          python scripts/build_semantic_bindings.py
          python tests/validate_semantic_model.py
      - name: Validate pinned NCBI taxon bindings
        run: python scripts/validate_ncbi_taxon_bindings.py
      - name: Parse semantic distributions
        run: |
          python -c 'from rdflib import Graph; [Graph().parse(path) for path in ["dist/pilot/prac.jsonld", "dist/pilot/prac.ttl", "dist/pilot/out.jsonld", "dist/pilot/out.ttl", "dist/livestock-staging/aom-livestock.jsonld", "dist/livestock-staging/aom-livestock.ttl", "dist/livestock-staging/aom-schema.ttl", "dist/livestock-staging/aom-semantic-bindings.jsonld", "dist/livestock-staging/aom-semantic-bindings.ttl"]]'
      - name: Validate SHACL
        run: |
          pyshacl --shacl schemas/shacl/concepts.ttl dist/pilot/prac.ttl
          pyshacl --shacl schemas/shacl/concepts.ttl dist/pilot/out.ttl
          pyshacl --shacl schemas/shacl/concepts.ttl dist/livestock-staging/aom-livestock.ttl
      - name: Validate persistent-identifier proposal tooling
        run: |
          python tests/test_w3id_proposal.py
          python scripts/build_w3id_proposal.py --config=config/publication-targets.json --output=/tmp/era-aom-w3id
          python scripts/validate_w3id_proposal.py /tmp/era-aom-w3id
      - name: Rebuild and validate release candidate
        run: |
          python scripts/build_release_candidate.py --config=config/releases/2026.1-rc.1.json
          python scripts/validate_release_candidate.py --release=2026.1-rc.1
          python scripts/validate_bulk_proposals.py templates/bulk-change-proposals.csv --allow-empty
          python scripts/validate_deployment_bundle.py

  browser-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start browser stack
        run: docker compose -f deploy/local/compose.yaml up --build --detach
      - name: Verify loaded graph and browser
        run: |
          python scripts/check_browser_stack.py --attempts=90 --delay=2
          python -m pip install --requirement requirements-dev.txt
          python scripts/run_local_acceptance.py --output=acceptance-results
      - name: Upload local acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: era-aom-local-acceptance
          path: acceptance-results/
          if-no-files-found: warn
      - name: Capture container logs on failure
        if: failure()
        run: docker compose -f deploy/local/compose.yaml logs --no-color
      - name: Stop browser stack
        if: always()
        run: docker compose -f deploy/local/compose.yaml down --volumes
